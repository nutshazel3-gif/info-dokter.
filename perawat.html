<!-- FIREBASE -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* =====================================================
   GANTI CONFIG FIREBASE ANDA DI SINI
===================================================== */

const firebaseConfig = {

  apiKey: "GANTI_API_KEY",

  authDomain:
    "GANTI_PROJECT_ID.firebaseapp.com",

  databaseURL:
    "https://GANTI_PROJECT_ID-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "GANTI_PROJECT_ID",

  storageBucket:
    "GANTI_PROJECT_ID.firebasestorage.app",

  messagingSenderId:
    "GANTI_MESSAGING_SENDER_ID",

  appId:
    "GANTI_APP_ID"

};


/* =====================================================
   FIREBASE
===================================================== */

const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getDatabase(firebaseApp);

const auth =
  getAuth(firebaseApp);


let firebaseReady =
  false;


signInAnonymously(auth)
  .then(function() {

    firebaseReady = true;

    console.log(
      'Firebase realtime siap.'
    );

  })
  .catch(function(error) {

    console.error(
      'Firebase Auth Error:',
      error
    );

  });


/* =====================================================
   KIRIM SINYAL PERUBAHAN
===================================================== */

window.notifyFirebaseChange =
  async function() {

    if (!firebaseReady) {

      console.warn(
        'Firebase belum siap.'
      );

      return false;
    }

    try {

      await set(
        ref(
          db,
          'realtime/lastUpdate'
        ),
        {
          timestamp:
            Date.now(),

          source:
            'perawat',

          event:
            'DATA_UPDATED'
        }
      );

      console.log(
        'Firebase: DATA_UPDATED'
      );

      return true;

    } catch (error) {

      console.error(
        'Firebase notification error:',
        error
      );

      return false;
    }
  };

</script>


<script>

/* =====================================================
   API GOOGLE APPS SCRIPT
===================================================== */

/*
 * GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT
 */

const API_URL =
  'GANTI_DENGAN_URL_WEB_APP_ANDA';


let editMode = false;

let editId = '';

let dokterList = [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    editId =
      new URLSearchParams(
        window.location.search
      ).get('id') || '';

    editMode =
      Boolean(editId);

    if (editMode) {

      document
        .getElementById('pageTitle')
        .textContent =
        'Edit Informasi';

      document
        .getElementById('submitButton')
        .textContent =
        'Simpan Perubahan';
    }

    document
      .getElementById(
        'ID_DOKTER'
      )
      .addEventListener(
        'change',
        fillDoctorInfo
      );

    document
      .getElementById(
        'JENIS_INFORMASI'
      )
      .addEventListener(
        'change',
        updateSections
      );

    document
      .getElementById(
        'TGL_SELESAI_MODE'
      )
      .addEventListener(
        'change',
        updateFinishDate
      );

    document
      .getElementById(
        'infoForm'
      )
      .addEventListener(
        'submit',
        saveForm
      );

    await loadDoctors();

    updateSections();

    updateFinishDate();

    if (editMode) {

      await loadEditData();
    }
  }
);


/* =====================================================
   LOAD DOKTER
===================================================== */

async function loadDoctors() {

  const select =
    document.getElementById(
      'ID_DOKTER'
    );

  try {

    const response =
      await fetch(
        API_URL +
        '?aksi=get_dokter&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    const result =
      await response.json();

    if (
      result.status !==
      'success'
    ) {
      throw new Error(
        result.message ||
        'Gagal mengambil dokter.'
      );
    }

    dokterList =
      Array.isArray(result.data)
        ? result.data
        : [];

    select.innerHTML =
      '<option value="">Pilih dokter...</option>';

    dokterList.forEach(
      function(dokter) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          dokter.id;

        option.textContent =
          dokter.nama +
          (
            dokter.poli
              ? ' · ' + dokter.poli
              : ''
          );

        option.dataset.nama =
          dokter.nama || '';

        option.dataset.poli =
          dokter.poli || '';

        select.appendChild(
          option
        );
      }
    );

  } catch (error) {

    select.innerHTML =
      '<option value="">Gagal memuat dokter</option>';

    alert(
      'Gagal memuat dokter:\n' +
      error.message
    );
  }
}


/* =====================================================
   DOCTOR INFO
===================================================== */

function fillDoctorInfo() {

  const id =
    document.getElementById(
      'ID_DOKTER'
    ).value;

  const dokter =
    dokterList.find(
      x =>
        String(x.id) ===
        String(id)
    );

  document
    .getElementById(
      'NAMA_DOKTER'
    )
    .value =
    dokter
      ? dokter.nama || ''
      : '';

  document
    .getElementById(
      'POLI'
    )
    .value =
    dokter
      ? dokter.poli || ''
      : '';
}


/* =====================================================
   SECTIONS
===================================================== */

function updateSections() {

  const jenis =
    document
      .getElementById(
        'JENIS_INFORMASI'
      )
      .value;

  document
    .getElementById(
      'sectionIzin'
    )
    .classList.toggle(
      'hidden',
      jenis !==
      'DOKTER_IZIN'
    );

  document
    .getElementById(
      'sectionKuota'
    )
    .classList.toggle(
      'hidden',
      jenis !==
      'PERUBAHAN_KUOTA'
    );

  document
    .getElementById(
      'sectionJam'
    )
    .classList.toggle(
      'hidden',
      jenis !==
      'PERUBAHAN_JAM'
    );
}


/* =====================================================
   FINISH DATE
===================================================== */

function updateFinishDate() {

  const mode =
    document
      .getElementById(
        'TGL_SELESAI_MODE'
      )
      .value;

  const date =
    document
      .getElementById(
        'TGL_SELESAI'
      );

  if (
    mode ===
    'SAMPAI_INFORMASI'
  ) {

    date.classList.add(
      'hidden'
    );

    date.required =
      false;

  } else {

    date.classList.remove(
      'hidden'
    );

    date.required =
      true;
  }
}


/* =====================================================
   LOAD EDIT DATA
===================================================== */

async function loadEditData() {

  try {

    const response =
      await fetch(
        API_URL +
        '?aksi=get_info_by_id&id=' +
        encodeURIComponent(
          editId
        ) +
        '&_=' +
        Date.now(),
        {
          cache: 'no-store'
        }
      );

    const result =
      await response.json();

    if (
      result.status !==
      'success'
    ) {
      throw new Error(
        result.message ||
        'Data edit tidak ditemukan.'
      );
    }

    fillEditForm(
      result.data
    );

  } catch (error) {

    alert(
      'Gagal mengambil data untuk diedit:\n' +
      error.message
    );

    window.location.href =
      'index.html';
  }
}


/* =====================================================
   FILL EDIT
===================================================== */

function fillEditForm(data) {

  setValue(
    'ID_DOKTER',
    data.ID_DOKTER
  );

  fillDoctorInfo();

  setValue(
    'JENIS_INFORMASI',
    data.JENIS_INFORMASI
  );

  setValue(
    'TGL_MULAI',
    data.TGL_MULAI
  );

  if (
    String(
      data.TGL_SELESAI || ''
    ).toUpperCase() ===
    'SAMPAI_INFORMASI'
    ||
    String(
      data.IZIN_SAMPAI_INFO || ''
    ).toUpperCase() ===
    'YA'
  ) {

    setValue(
      'TGL_SELESAI_MODE',
      'SAMPAI_INFORMASI'
    );

  } else {

    setValue(
      'TGL_SELESAI_MODE',
      'TANGGAL'
    );

    setValue(
      'TGL_SELESAI',
      data.TGL_SELESAI
    );
  }

  setValue(
    'SESI',
    data.SESI || 'SEMUA'
  );

  setValue(
    'DOKTER_PENGGANTI',
    data.DOKTER_PENGGANTI
  );

  setValue(
    'TGL_MULAI_PRAKTEK',
    data.TGL_MULAI_PRAKTEK
  );

  setValue(
    'SESI_KEMBALI',
    data.SESI_KEMBALI
  );

  setValue(
    'KUOTA_LAMA',
    data.KUOTA_LAMA
  );

  setValue(
    'KUOTA',
    data.KUOTA
  );

  setValue(
    'JAM_MULAI_LAMA',
    data.JAM_MULAI_LAMA
  );

  setValue(
    'JAM_SELESAI_LAMA',
    data.JAM_SELESAI_LAMA
  );

  setValue(
    'JAM_MULAI',
    data.JAM_MULAI
  );

  setValue(
    'JAM_SELESAI',
    data.JAM_SELESAI
  );

  setValue(
    'KETERANGAN',
    data.KETERANGAN
  );

  setValue(
    'DIINPUT_OLEH',
    data.DIINPUT_OLEH ||
    'PERAWAT'
  );

  updateSections();

  updateFinishDate();
}


/* =====================================================
   SAVE
===================================================== */

async function saveForm(event) {

  event.preventDefault();

  const button =
    document.getElementById(
      'submitButton'
    );

  const originalText =
    button.textContent;

  button.disabled = true;

  button.textContent =
    editMode
      ? 'Menyimpan perubahan...'
      : 'Menyimpan...';

  try {

    const doctorId =
      document
        .getElementById(
          'ID_DOKTER'
        )
        .value;

    if (!doctorId) {
      throw new Error(
        'Dokter wajib dipilih.'
      );
    }

    const jenis =
      document
        .getElementById(
          'JENIS_INFORMASI'
        )
        .value;

    const finishMode =
      document
        .getElementById(
          'TGL_SELESAI_MODE'
        )
        .value;

    const payload = {

      aksi:
        editMode
          ? 'update_info'
          : 'simpan_info',

      ID_INFORMASI:
        editMode
          ? editId
          : '',

      ID_DOKTER:
        doctorId,

      NAMA_DOKTER:
        document
          .getElementById(
            'NAMA_DOKTER'
          ).value,

      POLI:
        document
          .getElementById(
            'POLI'
          ).value,

      JENIS_INFORMASI:
        jenis,

      TGL_MULAI:
        document
          .getElementById(
            'TGL_MULAI'
          ).value,

      TGL_SELESAI:
        finishMode ===
        'SAMPAI_INFORMASI'
          ? 'SAMPAI_INFORMASI'
          : document
              .getElementById(
                'TGL_SELESAI'
              ).value,

      SESI:
        document
          .getElementById(
            'SESI'
          ).value,

      DOKTER_PENGGANTI:
        document
          .getElementById(
            'DOKTER_PENGGANTI'
          ).value,

      TGL_MULAI_PRAKTEK:
        document
          .getElementById(
            'TGL_MULAI_PRAKTEK'
          ).value,

      SESI_KEMBALI:
        document
          .getElementById(
            'SESI_KEMBALI'
          ).value,

      KUOTA_LAMA:
        document
          .getElementById(
            'KUOTA_LAMA'
          ).value,

      KUOTA:
        document
          .getElementById(
            'KUOTA'
          ).value,

      JAM_MULAI_LAMA:
        document
          .getElementById(
            'JAM_MULAI_LAMA'
          ).value,

      JAM_SELESAI_LAMA:
        document
          .getElementById(
            'JAM_SELESAI_LAMA'
          ).value,

      JAM_MULAI:
        document
          .getElementById(
            'JAM_MULAI'
          ).value,

      JAM_SELESAI:
        document
          .getElementById(
            'JAM_SELESAI'
          ).value,

      KETERANGAN:
        document
          .getElementById(
            'KETERANGAN'
          ).value,

      DIINPUT_OLEH:
        document
          .getElementById(
            'DIINPUT_OLEH'
          ).value ||
        'PERAWAT'
    };


    /* =================================================
       KIRIM KE GOOGLE APPS SCRIPT
    ================================================= */

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const result =
      await response.json();


    if (
      result.status !==
      'success'
    ) {

      throw new Error(
        result.message ||
        'Data gagal disimpan.'
      );
    }


    /* =================================================
       GOOGLE SHEETS SUDAH BERHASIL
       SEKARANG BARU KIRIM SIGNAL FIREBASE
    ================================================= */

    if (
      typeof window
        .notifyFirebaseChange ===
      'function'
    ) {

      await window
        .notifyFirebaseChange();
    }


    alert(
      editMode
        ? 'Perubahan berhasil disimpan.'
        : 'Informasi berhasil ditambahkan.'
    );


    window.location.href =
      'index.html';


  } catch (error) {

    console.error(error);

    alert(
      'Gagal menyimpan data:\n' +
      error.message
    );

    button.disabled =
      false;

    button.textContent =
      originalText;
  }
}


/* =====================================================
   HELPER
===================================================== */

function setValue(
  id,
  value
) {

  const el =
    document.getElementById(id);

  if (!el) return;

  el.value =
    value === null ||
    value === undefined
      ? ''
      : String(value)
        .substring(0, 10);
}

</script>
