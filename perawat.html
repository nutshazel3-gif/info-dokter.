<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal Perawat - RS Islam Bontang</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .field {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
    }

    .field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, .15);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <header class="bg-slate-900 text-white px-5 py-4">
    <div class="max-w-6xl mx-auto flex flex-wrap justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold">Portal Perawat</h1>
        <p class="text-sm text-slate-300">
          Input dan perubahan informasi pelayanan dokter
        </p>
      </div>

      <a
        href="index.html"
        class="rounded-lg bg-white px-4 py-2 text-slate-800 hover:bg-slate-100">
        Kembali ke Dashboard
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-5">

    <div id="messageBox"
         class="hidden mb-5 rounded-lg px-4 py-3"></div>

    <form id="informationForm"
          class="bg-white rounded-xl border p-5 space-y-6">

      <div class="flex flex-wrap justify-between items-center gap-3">
        <div>
          <h2 id="formTitle" class="text-xl font-bold text-slate-800">
            Tambah Informasi
          </h2>

          <p class="text-sm text-slate-500">
            Semua perubahan akan disimpan ke Google Sheets.
          </p>
        </div>

        <span id="modeBadge"
              class="rounded-full bg-green-100 px-3 py-1 text-sm text-green-700">
          Data Baru
        </span>
      </div>

      <input type="hidden" id="ID_INFORMASI" name="ID_INFORMASI">

      <!-- DATA DOKTER -->
      <section>
        <div class="section-title">Data Dokter</div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label" for="ID_DOKTER">
              Dokter
            </label>

            <select id="ID_DOKTER"
                    name="ID_DOKTER"
                    class="field"
                    required>
              <option value="">Memuat daftar dokter...</option>
            </select>
          </div>

          <div>
            <label class="field-label" for="NAMA_DOKTER">
              Nama Dokter
            </label>

            <input
              id="NAMA_DOKTER"
              name="NAMA_DOKTER"
              class="field bg-slate-100"
              readonly
              required>
          </div>

          <div>
            <label class="field-label" for="POLI">
              Poli
            </label>

            <input
              id="POLI"
              name="POLI"
              class="field bg-slate-100"
              readonly
              required>
          </div>

          <div>
            <label class="field-label" for="DIINPUT_OLEH">
              Diinput Oleh
            </label>

            <input
              id="DIINPUT_OLEH"
              name="DIINPUT_OLEH"
              class="field"
              placeholder="Nama petugas"
              required>
          </div>
        </div>
      </section>

      <!-- JENIS INFORMASI -->
      <section>
        <div class="section-title">Jenis Informasi</div>

        <div>
          <label class="field-label" for="JENIS_INFORMASI">
            Pilih Jenis Informasi
          </label>

          <select
            id="JENIS_INFORMASI"
            name="JENIS_INFORMASI"
            class="field"
            required>
            <option value="">-- Pilih Jenis --</option>
            <option value="DOKTER_IZIN">Dokter Izin</option>
            <option value="PERUBAHAN_KUOTA">Perubahan Kuota</option>
            <option value="PERUBAHAN_JAM">Perubahan Jam Praktik</option>
          </select>
        </div>
      </section>

      <!-- TANGGAL DAN SESI -->
      <section>
        <div class="section-title">Tanggal dan Sesi</div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="field-label" for="TGL_MULAI">
              Tanggal Mulai
            </label>

            <input
              type="date"
              id="TGL_MULAI"
              name="TGL_MULAI"
              class="field"
              required>
          </div>

          <div>
            <label class="field-label" for="TGL_SELESAI">
              Tanggal Selesai
            </label>

            <select
              id="TGL_SELESAI"
              name="TGL_SELESAI"
              class="field">
              <option value="">Pilih tanggal selesai</option>
              <option value="SAMPAI_INFORMASI">
                Sampai informasi lebih lanjut
              </option>
            </select>

            <input
              type="date"
              id="TGL_SELESAI_DATE"
              class="field mt-2">
          </div>

          <div>
            <label class="field-label" for="SESI">
              Sesi
            </label>

            <select id="SESI" name="SESI" class="field">
              <option value="SEMUA">Semua Sesi</option>
              <option value="PAGI">Pagi</option>
              <option value="SIANG">Siang</option>
              <option value="SORE">Sore</option>
              <option value="MALAM">Malam</option>
            </select>
          </div>
        </div>
      </section>

      <!-- DOKTER IZIN -->
      <section id="leaveSection" class="hidden">
        <div class="section-title">Detail Dokter Izin</div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label" for="DOKTER_PENGGANTI">
              Dokter Pengganti
            </label>

            <input
              id="DOKTER_PENGGANTI"
              name="DOKTER_PENGGANTI"
              class="field"
              placeholder="Nama dokter pengganti">
          </div>

          <div>
            <label class="field-label" for="TGL_MULAI_PRAKTEK">
              Mulai Praktik Kembali
            </label>

            <input
              type="date"
              id="TGL_MULAI_PRAKTEK"
              name="TGL_MULAI_PRAKTEK"
              class="field">
          </div>

          <div>
            <label class="field-label" for="SESI_KEMBALI">
              Sesi Kembali
            </label>

            <select
              id="SESI_KEMBALI"
              name="SESI_KEMBALI"
              class="field">
              <option value="">Pilih sesi</option>
              <option value="PAGI">Pagi</option>
              <option value="SIANG">Siang</option>
              <option value="SORE">Sore</option>
              <option value="MALAM">Malam</option>
            </select>
          </div>
        </div>
      </section>

      <!-- KUOTA -->
      <section id="quotaSection" class="hidden">
        <div class="section-title">Detail Perubahan Kuota</div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label" for="KUOTA_LAMA">
              Kuota Lama
            </label>

            <input
              type="number"
              id="KUOTA_LAMA"
              name="KUOTA_LAMA"
              class="field"
              min="0">
          </div>

          <div>
            <label class="field-label" for="KUOTA">
              Kuota Baru
            </label>

            <input
              type="number"
              id="KUOTA"
              name="KUOTA"
              class="field"
              min="0">
          </div>
        </div>
      </section>

      <!-- JAM -->
      <section id="timeSection" class="hidden">
        <div class="section-title">Detail Perubahan Jam Praktik</div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="field-label" for="JAM_MULAI_LAMA">
              Jam Mulai Lama
            </label>

            <input
              type="time"
              id="JAM_MULAI_LAMA"
              name="JAM_MULAI_LAMA"
              class="field">
          </div>

          <div>
            <label class="field-label" for="JAM_SELESAI_LAMA">
              Jam Selesai Lama
            </label>

            <input
              type="time"
              id="JAM_SELESAI_LAMA"
              name="JAM_SELESAI_LAMA"
              class="field">
          </div>

          <div>
            <label class="field-label" for="JAM_MULAI">
              Jam Mulai Baru
            </label>

            <input
              type="time"
              id="JAM_MULAI"
              name="JAM_MULAI"
              class="field">
          </div>

          <div>
            <label class="field-label" for="JAM_SELESAI">
              Jam Selesai Baru
            </label>

            <input
              type="time"
              id="JAM_SELESAI"
              name="JAM_SELESAI"
              class="field">
          </div>
        </div>
      </section>

      <!-- KETERANGAN -->
      <section>
        <div class="section-title">Keterangan</div>

        <textarea
          id="KETERANGAN"
          name="KETERANGAN"
          rows="4"
          class="field"
          placeholder="Tuliskan keterangan informasi..."></textarea>
      </section>

      <!-- BUTTON -->
      <div class="flex flex-wrap justify-end gap-3 border-t pt-5">
        <a
          href="index.html"
          class="rounded-lg border px-5 py-2 text-slate-700 hover:bg-slate-100">
          Batal
        </a>

        <button
          id="submitButton"
          type="submit"
          class="rounded-lg bg-blue-600 px-5 py-2 text-white hover:bg-blue-700">
          Simpan Informasi
        </button>
      </div>
    </form>
  </main>

  <script>
    const API_URL =
      localStorage.getItem('rsi_appscript_url') ||
      'https://script.google.com/macros/s/AKfycbxHNqfVkTu9onyXq3pXVMfApJRRRDOx8AmTThrHMl6TbubtSmz5b_XJxpuHzMbmdG4NKw/exec';

    let dokterList = [];
    let editMode = false;

    const form = document.getElementById('informationForm');

    document.addEventListener('DOMContentLoaded', async () => {
      await loadDokter();

      const id = new URLSearchParams(window.location.search).get('id');

      if (id) {
        await loadEditData(id);
      }

      updateSections();
    });

    document.getElementById('ID_DOKTER').addEventListener('change', () => {
      const selected = dokterList.find(
        dokter =>
          String(dokter.id) ===
          String(document.getElementById('ID_DOKTER').value)
      );

      if (!selected) return;

      document.getElementById('NAMA_DOKTER').value =
        selected.nama || '';

      document.getElementById('POLI').value =
        selected.poli || '';
    });

    document.getElementById('JENIS_INFORMASI')
      .addEventListener('change', updateSections);

    document.getElementById('TGL_SELESAI')
      .addEventListener('change', updateFinishDate);

    form.addEventListener('submit', saveInformation);

    async function loadDokter() {
      try {
        const response = await fetch(
          API_URL + '?aksi=get_dokter'
        );

        const result = await response.json();

        if (result.status !== 'success') {
          throw new Error(result.message || 'Gagal memuat dokter.');
        }

        dokterList = Array.isArray(result.data)
          ? result.data
          : [];

        const select = document.getElementById('ID_DOKTER');

        select.innerHTML =
          '<option value="">-- Pilih Dokter --</option>';

        dokterList.forEach(dokter => {
          const option = document.createElement('option');

          option.value = dokter.id;
          option.textContent =
            `${dokter.nama} - ${dokter.poli || '-'}`;

          select.appendChild(option);
        });

      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    async function loadEditData(id) {
      try {
        const response = await fetch(
          API_URL +
          '?aksi=get_info_by_id&id=' +
          encodeURIComponent(id)
        );

        const result = await response.json();

        if (result.status !== 'success' || !result.data) {
          throw new Error(result.message || 'Data edit tidak ditemukan.');
        }

        editMode = true;

        document.getElementById('formTitle').textContent =
          'Edit Informasi';

        document.getElementById('modeBadge').textContent =
          'Mode Edit';

        document.getElementById('modeBadge').className =
          'rounded-full bg-orange-100 px-3 py-1 text-sm text-orange-700';

        document.getElementById('submitButton').textContent =
          'Simpan Perubahan';

        fillForm(result.data);

      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    function fillForm(data) {
      const fields = [
        'ID_INFORMASI',
        'ID_DOKTER',
        'NAMA_DOKTER',
        'POLI',
        'JENIS_INFORMASI',
        'TGL_MULAI',
        'SESI',
        'TGL_MULAI_PRAKTEK',
        'SESI_KEMBALI',
        'JAM_MULAI',
        'JAM_SELESAI',
        'JAM_MULAI_LAMA',
        'JAM_SELESAI_LAMA',
        'KUOTA',
        'KUOTA_LAMA',
        'DOKTER_PENGGANTI',
        'KETERANGAN',
        'DIINPUT_OLEH'
      ];

      fields.forEach(field => {
        const element = document.getElementById(field);

        if (element) {
          element.value = data[field] ?? '';
        }
      });

      const selesaiSelect =
        document.getElementById('TGL_SELESAI');

      const selesaiDate =
        document.getElementById('TGL_SELESAI_DATE');

      if (data.TGL_SELESAI === 'SAMPAI_INFORMASI') {
        selesaiSelect.value = 'SAMPAI_INFORMASI';
        selesaiDate.value = '';
      } else {
        selesaiSelect.value = '';
        selesaiDate.value = data.TGL_SELESAI || '';
      }

      updateSections();
    }

    function updateSections() {
      const jenis =
        document.getElementById('JENIS_INFORMASI').value;

      document.getElementById('leaveSection')
        .classList.toggle(
          'hidden',
          jenis !== 'DOKTER_IZIN'
        );

      document.getElementById('quotaSection')
        .classList.toggle(
          'hidden',
          jenis !== 'PERUBAHAN_KUOTA'
        );

      document.getElementById('timeSection')
        .classList.toggle(
          'hidden',
          jenis !== 'PERUBAHAN_JAM'
        );
    }

    function updateFinishDate() {
      const select =
        document.getElementById('TGL_SELESAI');

      const date =
        document.getElementById('TGL_SELESAI_DATE');

      if (select.value === 'SAMPAI_INFORMASI') {
        date.value = '';
        date.classList.add('hidden');
      } else {
        date.classList.remove('hidden');
      }
    }

    async function saveInformation(event) {
      event.preventDefault();

      const button =
        document.getElementById('submitButton');

      button.disabled = true;
      button.textContent = 'Menyimpan...';

      try {
        const payload = collectFormData();

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status !== 'success') {
          throw new Error(
            result.message || 'Data gagal disimpan.'
          );
        }

        showMessage(
          result.message || 'Data berhasil disimpan.',
          'success'
        );

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);

      } catch (error) {
        showMessage(error.message, 'error');

        button.disabled = false;
        button.textContent = editMode
          ? 'Simpan Perubahan'
          : 'Simpan Informasi';
      }
    }

    function collectFormData() {
      const data = {};

      const fields = [
        'ID_INFORMASI',
        'ID_DOKTER',
        'NAMA_DOKTER',
        'POLI',
        'JENIS_INFORMASI',
        'TGL_MULAI',
        'SESI',
        'TGL_MULAI_PRAKTEK',
        'SESI_KEMBALI',
        'JAM_MULAI',
        'JAM_SELESAI',
        'JAM_MULAI_LAMA',
        'JAM_SELESAI_LAMA',
        'KUOTA',
        'KUOTA_LAMA',
        'DOKTER_PENGGANTI',
        'KETERANGAN',
        'DIINPUT_OLEH'
      ];

      fields.forEach(field => {
        const element = document.getElementById(field);

        if (element) {
          data[field] = element.value.trim();
        }
      });

      const finishSelect =
        document.getElementById('TGL_SELESAI');

      const finishDate =
        document.getElementById('TGL_SELESAI_DATE');

      data.TGL_SELESAI =
        finishSelect.value === 'SAMPAI_INFORMASI'
          ? 'SAMPAI_INFORMASI'
          : finishDate.value;

      data.aksi = editMode
        ? 'update_info'
        : 'simpan_info';

      return data;
    }

    function showMessage(message, type) {
      const box = document.getElementById('messageBox');

      box.textContent = message;
      box.classList.remove(
        'hidden',
        'bg-green-100',
        'text-green-700',
        'bg-red-100',
        'text-red-700'
      );

      if (type === 'success') {
        box.classList.add('bg-green-100', 'text-green-700');
      } else {
        box.classList.add('bg-red-100', 'text-red-700');
      }
    }
  </script>
</body>
</html>
