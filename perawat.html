<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Input Informasi Dokter</title>

<style>

:root{
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#10243a;
  --line:rgba(255,255,255,.09);
  --text:#f8fafc;
  --muted:#8fa3b8;
  --blue:#38bdf8;
  --green:#34d399;
  --red:#fb7185;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at top right,
      #173454,
      #07111f 42%
    );
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    sans-serif;
}

.wrapper{
  width:min(900px,94%);
  margin:35px auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
}

.title h1{
  margin:0;
  font-size:25px;
}

.title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.back{
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:12px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
}

.form{
  background:
    rgba(13,27,45,.95);
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.2);
}

.mode{
  display:inline-flex;
  padding:7px 12px;
  border-radius:999px;
  background:rgba(56,189,248,.1);
  color:var(--blue);
  font-size:11px;
  font-weight:800;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:17px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  color:#b7c6d6;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  background:#091827;
  color:white;
  padding:13px 14px;
  outline:none;
  font:inherit;
}

input:focus,
select:focus,
textarea:focus{
  border-color:
    rgba(56,189,248,.65);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.doctor-wrap{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:100%;
  margin-top:5px;
  border:1px solid var(--line);
  background:#0b192a;
  border-radius:13px;
  overflow:hidden;
  max-height:260px;
  overflow-y:auto;
  box-shadow:
    0 20px 40px rgba(0,0,0,.3);
}

.suggestion{
  padding:12px 14px;
  cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.suggestion:hover{
  background:rgba(56,189,248,.1);
}

.suggestion strong{
  display:block;
  font-size:13px;
}

.suggestion span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.hidden{
  display:none!important;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:9px;
  padding:12px 14px;
  border-radius:13px;
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
}

.checkbox input{
  width:auto;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:25px;
}

button{
  font:inherit;
}

.btn{
  border:0;
  border-radius:13px;
  padding:13px 19px;
  cursor:pointer;
  font-weight:800;
}

.btn-cancel{
  background:#17283c;
  color:white;
}

.btn-save{
  background:
    linear-gradient(
      135deg,
      #0ea5e9,
      #6366f1
    );
  color:white;
}

.btn-save:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.alert{
  padding:13px 15px;
  border-radius:13px;
  margin-bottom:18px;
  font-size:13px;
  line-height:1.5;
}

.alert.error{
  background:rgba(251,113,133,.1);
  color:#fecdd3;
  border:1px solid rgba(251,113,133,.2);
}

.alert.success{
  background:rgba(52,211,153,.1);
  color:#a7f3d0;
  border:1px solid rgba(52,211,153,.2);
}

.hint{
  color:var(--muted);
  font-size:11px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .top{
    align-items:flex-start;
  }

  .actions{
    flex-direction:column-reverse;
  }

  .btn{
    width:100%;
  }

}

</style>

</head>

<body>

<div class="wrapper">

  <div class="top">

    <div class="title">

      <h1 id="pageTitle">
        Input Informasi Dokter
      </h1>

      <p>
        Kelola informasi pelayanan dokter rawat jalan
      </p>

    </div>

    <button
      class="back"
      onclick="goDashboard()">

      ← Dashboard

    </button>

  </div>


  <div id="alert"></div>


  <form
    id="form"
    class="form"
    onsubmit="submitForm(event)">

    <div
      id="mode"
      class="mode">
      INPUT BARU
    </div>


    <div class="grid">

      <!-- DOKTER -->

      <div class="field full">

        <label>
          Dokter
        </label>

        <div class="doctor-wrap">

          <input
            id="doctorSearch"
            type="text"
            autocomplete="off"
            placeholder="Ketik nama dokter...">

          <div
            id="suggestions"
            class="suggestions hidden">
          </div>

        </div>

        <input
          id="ID_DOKTER"
          type="hidden">

        <input
          id="NAMA_DOKTER"
          type="hidden">

        <div
          id="doctorHint"
          class="hint">
          Ketik nama dokter untuk memilih.
        </div>

      </div>


      <!-- POLI -->

      <div class="field">

        <label>
          Poli
        </label>

        <input
          id="POLI"
          type="text"
          placeholder="Poli dokter">

      </div>


      <!-- JENIS -->

      <div class="field">

        <label>
          Jenis informasi
        </label>

        <select id="JENIS_INFORMASI"
                onchange="changeType()">

          <option value="">
            Pilih informasi
          </option>

          <option value="DOKTER_IZIN">
            Dokter Izin
          </option>

          <option value="PERUBAHAN_KUOTA">
            Perubahan Kuota
          </option>

          <option value="PERUBAHAN_JAM_PRAKTIK">
            Perubahan Jam Praktik
          </option>

        </select>

      </div>


      <!-- TANGGAL MULAI -->

      <div class="field">

        <label>
          Tanggal mulai
        </label>

        <input
          id="TGL_MULAI"
          type="date">

      </div>


      <!-- TANGGAL SELESAI -->

      <div
        id="fieldTanggalSelesai"
        class="field">

        <label>
          Tanggal selesai
        </label>

        <input
          id="TGL_SELESAI"
          type="date">

      </div>


      <!-- SAMPAI INFO -->

      <div
        id="fieldSampaiInfo"
        class="field full hidden">

        <label>
          Status izin
        </label>

        <label class="checkbox">

          <input
            id="SAMPAI_INFO"
            type="checkbox"
            onchange="toggleSampaiInfo()">

          <span>
            Izin sampai ada informasi selanjutnya
          </span>

        </label>

      </div>


      <!-- SESI -->

      <div
        id="fieldSesi"
        class="field">

        <label>
          Sesi
        </label>

        <select id="SESI">

          <option value="SEMUA">
            Semua sesi
          </option>

          <option value="PAGI">
            Pagi
          </option>

          <option value="SIANG">
            Siang
          </option>

          <option value="MALAM">
            Malam
          </option>

        </select>

      </div>


      <!-- PRAKTIK KEMBALI -->

      <div
        id="fieldPraktikKembali"
        class="field">

        <label>
          Tanggal mulai praktik kembali
        </label>

        <input
          id="TGL_MULAI_PRAKTEK"
          type="date">

      </div>


      <!-- SESI KEMBALI -->

      <div
        id="fieldSesiKembali"
        class="field">

        <label>
          Sesi praktik kembali
        </label>

        <select id="SESI_KEMBALI">

          <option value="">
            Pilih sesi
          </option>

          <option value="PAGI">
            Pagi
          </option>

          <option value="SIANG">
            Siang
          </option>

          <option value="MALAM">
            Malam
          </option>

        </select>

      </div>


      <!-- KUOTA -->

      <div
        id="fieldKuota"
        class="field hidden">

        <label>
          Kuota baru
        </label>

        <input
          id="KUOTA"
          type="number"
          min="0"
          placeholder="Contoh: 20">

      </div>


      <!-- JAM MULAI -->

      <div
        id="fieldJamMulai"
        class="field hidden">

        <label>
          Jam mulai praktik
        </label>

        <input
          id="JAM_MULAI"
          type="time">

      </div>


      <!-- JAM SELESAI -->

      <div
        id="fieldJamSelesai"
        class="field hidden">

        <label>
          Jam selesai praktik
        </label>

        <input
          id="JAM_SELESAI"
          type="time">

      </div>


      <!-- KETERANGAN -->

      <div
        class="field full">

        <label>
          Keterangan
        </label>

        <textarea
          id="KETERANGAN"
          placeholder="Keterangan tambahan..."></textarea>

      </div>


      <!-- INPUT OLEH -->

      <div class="field">

        <label>
          Diinput oleh
        </label>

        <input
          id="DIINPUT_OLEH"
          type="text"
          placeholder="Nama petugas">

      </div>

    </div>


    <div class="actions">

      <button
        type="button"
        class="btn btn-cancel"
        onclick="goDashboard()">

        Batal

      </button>

      <button
        id="btnSave"
        type="submit"
        class="btn btn-save">

        Simpan Informasi

      </button>

    </div>

  </form>

</div>


<script>

/* ============================================================
   KONFIGURASI
   ============================================================ */

const API_URL =
  https://script.google.com/macros/s/AKfycbxHNqfVkTu9onyXq3pXVMfApJRRRDOx8AmTThrHMl6TbubtSmz5b_XJxpuHzMbmdG4NKw/exec;


const DASHBOARD_URL =
  'GANTI_DENGAN_URL_GITHUB_INDEX';


let DOKTER = [];

let EDIT_ID = '';

let IS_EDIT = false;


/* ============================================================
   INIT
   ============================================================ */

document.addEventListener(
  'DOMContentLoaded',
  init
);


async function init(){

  EDIT_ID =
    new URLSearchParams(
      window.location.search
    ).get('edit') || '';

  IS_EDIT =
    Boolean(EDIT_ID);

  if(IS_EDIT){

    document
      .getElementById('mode')
      .textContent =
        'MODE EDIT';

    document
      .getElementById('pageTitle')
      .textContent =
        'Edit Informasi Dokter';

  }

  await loadDokter();

  setupAutocomplete();

  changeType();

  if(IS_EDIT){

    await loadEditData();

  }

}


/* ============================================================
   LOAD DOKTER
   ============================================================ */

async function loadDokter(){

  try{

    const response =
      await fetch(
        API_URL +
        '?aksi=get_dokter&_=' +
        Date.now()
      );

    const result =
      await response.json();

    if(
      result.status !==
      'success'
    ){

      throw new Error(
        result.message ||
        'Gagal mengambil daftar dokter.'
      );

    }

    DOKTER =
      Array.isArray(
        result.data
      )
      ?
      result.data
      :
      [];

  }catch(err){

    showAlert(
      err.message,
      'error'
    );

  }

}


/* ============================================================
   AUTOCOMPLETE
   ============================================================ */

function setupAutocomplete(){

  const input =
    document.getElementById(
      'doctorSearch'
    );

  input.addEventListener(
    'input',
    function(){

      const keyword =
        this.value
          .trim()
          .toLowerCase();

      /*
       * Bila user menghapus nama,
       * ID dokter juga dihapus.
       */

      document.getElementById(
        'ID_DOKTER'
      ).value = '';

      document.getElementById(
        'NAMA_DOKTER'
      ).value = '';

      if(!keyword){

        hideSuggestions();

        return;

      }

      const matches =
        DOKTER
          .filter(d => {

            const text =
              (
                d.nama +
                ' ' +
                d.spesialisasi +
                ' ' +
                d.poli
              )
              .toLowerCase();

            return text.includes(
              keyword
            );

          })
          .slice(0,10);

      showSuggestions(
        matches
      );

    }
  );


  document.addEventListener(
    'click',
    function(e){

      if(
        !e.target.closest(
          '.doctor-wrap'
        )
      ){

        hideSuggestions();

      }

    }
  );

}


/* ============================================================
   SUGGESTIONS
   ============================================================ */

function showSuggestions(
  items
){

  const box =
    document.getElementById(
      'suggestions'
    );

  if(!items.length){

    box.innerHTML =
      `
      <div class="suggestion">
        <span>Dokter tidak ditemukan</span>
      </div>
      `;

    box.classList.remove(
      'hidden'
    );

    return;

  }

  box.innerHTML =
    items
      .map(
        d =>
          `
          <div
            class="suggestion"
            onclick="selectDoctor(
              '${escapeAttr(d.id)}'
            )">

            <strong>
              ${escapeHtml(d.nama)}
            </strong>

            <span>
              ${escapeHtml(
                d.spesialisasi || ''
              )}
              ${
                d.poli
                ?
                ' · ' +
                escapeHtml(d.poli)
                :
                ''
              }
            </span>

          </div>
          `
      )
      .join('');

  box.classList.remove(
    'hidden'
  );

}


function selectDoctor(
  id
){

  const dokter =
    DOKTER.find(
      d =>
        String(d.id) ===
        String(id)
    );

  if(!dokter){
    return;
  }

  document.getElementById(
    'doctorSearch'
  ).value =
    dokter.nama;

  document.getElementById(
    'ID_DOKTER'
  ).value =
    dokter.id;

  document.getElementById(
    'NAMA_DOKTER'
  ).value =
    dokter.nama;

  document.getElementById(
    'POLI'
  ).value =
    dokter.poli || '';

  document.getElementById(
    'doctorHint'
  ).textContent =
    (
      dokter.spesialisasi ||
      'Dokter'
    ) +
    (
      dokter.poli
      ? ' · ' + dokter.poli
      : ''
    );

  hideSuggestions();

}


function hideSuggestions(){

  document
    .getElementById(
      'suggestions'
    )
    .classList.add(
      'hidden'
    );

}


/* ============================================================
   JENIS INFORMASI
   ============================================================ */

function changeType(){

  const type =
    document.getElementById(
      'JENIS_INFORMASI'
    ).value;

  hideAllSpecificFields();


  if(
    type ===
    'DOKTER_IZIN'
  ){

    show(
      'fieldTanggalSelesai'
    );

    show(
      'fieldSampaiInfo'
    );

    show(
      'fieldSesi'
    );

    show(
      'fieldPraktikKembali'
    );

    show(
      'fieldSesiKembali'
    );

    return;

  }


  if(
    type ===
    'PERUBAHAN_KUOTA'
  ){

    show(
      'fieldTanggalSelesai'
    );

    show(
      'fieldKuota'
    );

    return;

  }


  if(
    type ===
    'PERUBAHAN_JAM_PRAKTIK'
  ){

    show(
      'fieldTanggalSelesai'
    );

    show(
      'fieldJamMulai'
    );

    show(
      'fieldJamSelesai'
    );

    return;

  }

}


function hideAllSpecificFields(){

  [
    'fieldTanggalSelesai',
    'fieldSampaiInfo',
    'fieldSesi',
    'fieldPraktikKembali',
    'fieldSesiKembali',
    'fieldKuota',
    'fieldJamMulai',
    'fieldJamSelesai'
  ].forEach(
    id =>
      hide(id)
  );

}


function show(id){

  document
    .getElementById(id)
    .classList.remove(
      'hidden'
    );

}


function hide(id){

  document
    .getElementById(id)
    .classList.add(
      'hidden'
    );

}


/* ============================================================
   SAMPAI INFORMASI
   ============================================================ */

function toggleSampaiInfo(){

  const checked =
    document.getElementById(
      'SAMPAI_INFO'
    ).checked;

  const selesai =
    document.getElementById(
      'TGL_SELESAI'
    );

  selesai.disabled =
    checked;

  if(checked){

    selesai.value = '';

  }

}


/* ============================================================
   LOAD EDIT
   ============================================================ */

async function loadEditData(){

  try{

    const response =
      await fetch(
        API_URL +
        '?aksi=get_info_by_id&id=' +
        encodeURIComponent(
          EDIT_ID
        ) +
        '&_=' +
        Date.now()
      );

    const result =
      await response.json();

    if(
      result.status !==
      'success'
    ){

      throw new Error(
        result.message ||
        'Data edit tidak ditemukan.'
      );

    }

    fillForm(
      result.data
    );

  }catch(err){

    showAlert(
      err.message,
      'error'
    );

  }

}


/* ============================================================
   ISI FORM EDIT
   ============================================================ */

function fillForm(
  data
){

  document.getElementById(
    'ID_DOKTER'
  ).value =
    data.ID_DOKTER || '';

  document.getElementById(
    'NAMA_DOKTER'
  ).value =
    data.NAMA_DOKTER || '';

  document.getElementById(
    'doctorSearch'
  ).value =
    data.NAMA_DOKTER || '';

  document.getElementById(
    'POLI'
  ).value =
    data.POLI || '';

  document.getElementById(
    'JENIS_INFORMASI'
  ).value =
    data.JENIS_INFORMASI || '';

  document.getElementById(
    'TGL_MULAI'
  ).value =
    data.TGL_MULAI || '';

  document.getElementById(
    'TGL_SELESAI'
  ).value =
    data.TGL_SELESAI ===
    'SAMPAI_INFORMASI'
    ? ''
    : (
      data.TGL_SELESAI || ''
    );

  document.getElementById(
    'SAMPAI_INFO'
  ).checked =
    data.IZIN_SAMPAI_INFO ===
    'YA';

  document.getElementById(
    'SESI'
  ).value =
    data.SESI || 'SEMUA';

  document.getElementById(
    'TGL_MULAI_PRAKTEK'
  ).value =
    data.TGL_MULAI_PRAKTEK || '';

  document.getElementById(
    'SESI_KEMBALI'
  ).value =
    data.SESI_KEMBALI || '';

  document.getElementById(
    'JAM_MULAI'
  ).value =
    data.JAM_MULAI || '';

  document.getElementById(
    'JAM_SELESAI'
  ).value =
    data.JAM_SELESAI || '';

  document.getElementById(
    'KUOTA'
  ).value =
    data.KUOTA || '';

  document.getElementById(
    'KETERANGAN'
  ).value =
    data.KETERANGAN || '';

  document.getElementById(
    'DIINPUT_OLEH'
  ).value =
    data.DIINPUT_OLEH || '';

  document.getElementById(
    'doctorHint'
  ).textContent =
    'Data sedang diedit.';

  changeType();

  toggleSampaiInfo();

}


/* ============================================================
   SUBMIT
   ============================================================ */

async function submitForm(
  event
){

  event.preventDefault();

  const btn =
    document.getElementById(
      'btnSave'
    );

  btn.disabled = true;

  btn.textContent =
    'Menyimpan...';

  try{

    const payload =
      collectForm();

    validate(
      payload
    );

    payload.aksi =
      IS_EDIT
        ? 'update_info'
        : 'simpan_info';

    if(IS_EDIT){

      payload.ID_INFORMASI =
        EDIT_ID;

    }

    const response =
      await fetch(
        API_URL,
        {
          method:'POST',

          body:
            JSON.stringify(
              payload
            )
        }
      );

    const result =
      await response.json();

    if(
      result.status !==
      'success'
    ){

      throw new Error(
        result.message ||
        'Gagal menyimpan data.'
      );

    }

    showAlert(
      result.message,
      'success'
    );

    /*
     * Beri sedikit waktu supaya
     * pesan sukses terlihat,
     * kemudian kembali dashboard.
     */

    setTimeout(
      goDashboard,
      800
    );

  }catch(err){

    showAlert(
      err.message,
      'error'
    );

    btn.disabled = false;

    btn.textContent =
      IS_EDIT
        ? 'Simpan Perubahan'
        : 'Simpan Informasi';

  }

}


/* ============================================================
   COLLECT FORM
   ============================================================ */

function collectForm(){

  const sampaiInfo =
    document.getElementById(
      'SAMPAI_INFO'
    ).checked;

  return {

    ID_INFORMASI:
      EDIT_ID,

    ID_DOKTER:
      value('ID_DOKTER'),

    NAMA_DOKTER:
      value('NAMA_DOKTER'),

    POLI:
      value('POLI'),

    JENIS_INFORMASI:
      value('JENIS_INFORMASI'),

    TGL_MULAI:
      value('TGL_MULAI'),

    TGL_SELESAI:
      sampaiInfo
        ? 'SAMPAI_INFORMASI'
        : value('TGL_SELESAI'),

    IZIN_SAMPAI_INFO:
      sampaiInfo
        ? 'YA'
        : 'TIDAK',

    SESI:
      value('SESI') ||
      'SEMUA',

    TGL_MULAI_PRAKTEK:
      value('TGL_MULAI_PRAKTEK'),

    SESI_KEMBALI:
      value('SESI_KEMBALI'),

    JAM_MULAI:
      value('JAM_MULAI'),

    JAM_SELESAI:
      value('JAM_SELESAI'),

    KUOTA:
      value('KUOTA'),

    KETERANGAN:
      value('KETERANGAN'),

    DIINPUT_OLEH:
      value('DIINPUT_OLEH')

  };

}


/* ============================================================
   VALIDASI
   ============================================================ */

function validate(
  p
){

  if(!p.ID_DOKTER){

    throw new Error(
      'Silakan pilih dokter dari daftar.'
    );

  }

  if(!p.JENIS_INFORMASI){

    throw new Error(
      'Jenis informasi wajib dipilih.'
    );

  }

  if(!p.TGL_MULAI){

    throw new Error(
      'Tanggal mulai wajib diisi.'
    );

  }


  if(
    p.JENIS_INFORMASI ===
    'DOKTER_IZIN'
  ){

    if(
      p.TGL_SELESAI !==
      'SAMPAI_INFORMASI' &&
      !p.TGL_SELESAI
    ){

      throw new Error(
        'Tanggal selesai wajib diisi atau pilih izin sampai informasi selanjutnya.'
      );

    }

  }


  if(
    p.JENIS_INFORMASI ===
    'PERUBAHAN_KUOTA'
  ){

    if(
      p.KUOTA === ''
    ){

      throw new Error(
        'Kuota baru wajib diisi.'
      );

    }

  }


  if(
    p.JENIS_INFORMASI ===
    'PERUBAHAN_JAM_PRAKTIK'
  ){

    if(
      !p.JAM_MULAI ||
      !p.JAM_SELESAI
    ){

      throw new Error(
        'Jam mulai dan jam selesai wajib diisi.'
      );

    }

  }

}


/* ============================================================
   HELPERS
   ============================================================ */

function value(id){

  return document
    .getElementById(id)
    .value
    .trim();

}


function goDashboard(){

  window.location.href =
    DASHBOARD_URL;

}


function showAlert(
  message,
  type
){

  document.getElementById(
    'alert'
  ).innerHTML =

    `
    <div class="alert ${type}">
      ${escapeHtml(message)}
    </div>
    `;

}


function escapeHtml(value){

  return String(
    value == null ? '' : value
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function escapeAttr(value){

  return String(value || '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");

}
