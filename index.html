<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Papan Informasi Dokter</title>

<style>

:root{
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#10243a;
  --line:rgba(255,255,255,.08);
  --text:#f5f7fb;
  --muted:#8fa3b8;
  --blue:#38bdf8;
  --green:#34d399;
  --orange:#fbbf24;
  --red:#fb7185;
  --purple:#a78bfa;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(
      circle at top right,
      #173454 0,
      var(--bg) 38%
    );
  color:var(--text);
  min-height:100vh;
}

.container{
  width:min(1400px,94%);
  margin:auto;
}

header{
  padding:28px 0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      #0ea5e9,
      #6366f1
    );
  box-shadow:
    0 12px 35px rgba(14,165,233,.25);
}

.logo svg{
  width:28px;
  height:28px;
}

.title h1{
  margin:0;
  font-size:25px;
}

.title p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
}

.clock{
  text-align:right;
}

.clock .time{
  font-size:22px;
  font-weight:800;
}

.clock .date{
  color:var(--muted);
  font-size:12px;
}

.toolbar{
  display:flex;
  gap:12px;
  margin:15px 0 25px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:240px;
  position:relative;
}

.search input,
.filter select{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(13,27,45,.9);
  color:var(--text);
  padding:0 16px;
  outline:none;
}

.search input:focus,
.filter select:focus{
  border-color:rgba(56,189,248,.6);
}

.filter{
  width:220px;
}

.refresh{
  height:48px;
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:14px;
  padding:0 18px;
  cursor:pointer;
  font-weight:700;
}

.refresh:hover{
  background:var(--panel2);
}

.summary{
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:28px;
}

.summary-card{
  padding:20px;
  border:1px solid var(--line);
  background:rgba(13,27,45,.8);
  border-radius:18px;
}

.summary-label{
  color:var(--muted);
  font-size:12px;
}

.summary-number{
  margin-top:6px;
  font-size:28px;
  font-weight:900;
}

.section{
  margin-bottom:32px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
  font-weight:800;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
}

.dot.red{
  background:var(--red);
  box-shadow:0 0 14px var(--red);
}

.dot.orange{
  background:var(--orange);
  box-shadow:0 0 14px var(--orange);
}

.dot.purple{
  background:var(--purple);
  box-shadow:0 0 14px var(--purple);
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));
  gap:15px;
}

.card{
  position:relative;
  padding:19px;
  border-radius:19px;
  border:1px solid var(--line);
  background:
    linear-gradient(
      145deg,
      rgba(16,36,58,.95),
      rgba(8,19,33,.95)
    );
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.card:hover{
  transform:translateY(-4px) scale(1.01);
  border-color:
    rgba(56,189,248,.35);
  box-shadow:
    0 20px 45px rgba(0,0,0,.25);
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.doctor{
  font-size:17px;
  font-weight:850;
}

.special{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.badge.today{
  color:#052e1b;
  background:var(--green);
}

.badge.future{
  color:#3b2700;
  background:var(--orange);
}

.info{
  margin-top:18px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.045);
  font-size:12px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:var(--muted);
}

.info-value{
  text-align:right;
  font-weight:700;
}

.note{
  margin-top:13px;
  padding:11px;
  border-radius:11px;
  background:rgba(255,255,255,.035);
  color:#cbd5e1;
  font-size:12px;
  line-height:1.5;
}

.edit{
  position:absolute;
  right:15px;
  bottom:15px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  color:white;
  cursor:pointer;
}

.edit:hover{
  background:
    rgba(56,189,248,.15);
  border-color:
    rgba(56,189,248,.4);
}

.edit svg{
  width:17px;
  height:17px;
}

.empty{
  border:1px dashed var(--line);
  border-radius:16px;
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.error{
  padding:16px;
  border-radius:14px;
  background:rgba(251,113,133,.1);
  border:1px solid rgba(251,113,133,.25);
  color:#fecdd3;
}

footer{
  padding:35px 0;
  text-align:center;
  color:#64748b;
  font-size:11px;
}

@media(max-width:700px){

  .summary{
    grid-template-columns:1fr;
  }

  .clock{
    text-align:left;
  }

  header{
    align-items:flex-start;
  }

  .filter{
    width:100%;
  }

}

</style>

</head>

<body>

<div class="container">

<header>

  <div class="brand">

    <div class="logo">
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">
        <path d="M12 3v18"/>
        <path d="M3 12h18"/>
        <path d="M7 7h10v10H7z"/>
      </svg>
    </div>

    <div class="title">
      <h1>Papan Informasi Dokter</h1>
      <p>Informasi pelayanan dokter rawat jalan</p>
    </div>

  </div>

  <div class="clock">
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="date">Memuat...</div>
  </div>

</header>


<div class="toolbar">

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="Cari nama dokter atau poli..."
      oninput="render()">
  </div>

  <div class="filter">
    <select id="filter"
            onchange="render()">

      <option value="SEMUA">
        Semua informasi
      </option>

      <option value="DOKTER_IZIN">
        Dokter izin
      </option>

      <option value="PERUBAHAN_KUOTA">
        Perubahan kuota
      </option>

      <option value="PERUBAHAN_JAM_PRAKTIK">
        Perubahan jam praktik
      </option>

    </select>
  </div>

  <button class="refresh"
          onclick="loadDashboard()">
    ↻ Refresh
  </button>

</div>


<div class="summary">

  <div class="summary-card">
    <div class="summary-label">
      Dokter Izin
    </div>
    <div class="summary-number"
         id="sumIzin">
      0
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-label">
      Perubahan Kuota
    </div>
    <div class="summary-number"
         id="sumKuota">
      0
    </div>
  </div>

  <div class="summary-card">
    <div class="summary-label">
      Perubahan Jam Praktik
    </div>
    <div class="summary-number"
         id="sumJam">
      0
    </div>
  </div>

</div>


<div id="app">

  <div class="loading">
    Memuat informasi dokter...
  </div>

</div>


<footer>
  Sistem Informasi Dokter · Rawat Jalan
</footer>

</div>


<script>

/* ============================================================
   KONFIGURASI
   ============================================================ */

/*
 * GANTI dengan URL Web App Apps Script Anda.
 *
 * Contoh:
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const API_URL =
 https://script.google.com/macros/s/AKfycbxHNqfVkTu9onyXq3pXVMfApJRRRDOx8AmTThrHMl6TbubtSmz5b_XJxpuHzMbmdG4NKw/exec;


/*
 * GANTI dengan URL GitHub Pages perawat.html.
 *
 * Contoh:
 * https://username.github.io/informasi-dokter/perawat.html
 */

const PERAWAT_URL =
  'GANTI_DENGAN_URL_GITHUB_PERAWAT';


let DATA = [];


/* ============================================================
   CLOCK
   ============================================================ */

function updateClock(){

  const now =
    new Date();

  document
    .getElementById('clock')
    .textContent =
      now.toLocaleTimeString(
        'id-ID',
        {
          hour:'2-digit',
          minute:'2-digit',
          second:'2-digit'
        }
      );

  document
    .getElementById('date')
    .textContent =
      now.toLocaleDateString(
        'id-ID',
        {
          weekday:'long',
          day:'numeric',
          month:'long',
          year:'numeric'
        }
      );

}

setInterval(
  updateClock,
  1000
);

updateClock();


/* ============================================================
   LOAD DASHBOARD
   ============================================================ */

async function loadDashboard(){

  const app =
    document.getElementById('app');

  app.innerHTML =
    '<div class="loading">Memuat informasi dokter...</div>';

  try{

    const response =
      await fetch(
        API_URL +
        '?aksi=get_dashboard&_=' +
        Date.now()
      );

    const result =
      await response.json();

    if(
      result.status !== 'success'
    ){
      throw new Error(
        result.message ||
        'Gagal mengambil data.'
      );
    }

    DATA =
      Array.isArray(result.data)
        ? result.data
        : [];

    updateSummary();

    render();

  }catch(err){

    app.innerHTML =
      `
      <div class="error">
        <strong>Gagal memuat data.</strong>
        <br>
        ${escapeHtml(err.message)}
        <br><br>
        Periksa URL Apps Script dan deployment Web App.
      </div>
      `;

  }

}


/* ============================================================
   SUMMARY
   ============================================================ */

function updateSummary(){

  document.getElementById(
    'sumIzin'
  ).textContent =
    DATA.filter(
      x =>
        x.JENIS_INFORMASI ===
        'DOKTER_IZIN'
    ).length;

  document.getElementById(
    'sumKuota'
  ).textContent =
    DATA.filter(
      x =>
        x.JENIS_INFORMASI ===
        'PERUBAHAN_KUOTA'
    ).length;

  document.getElementById(
    'sumJam'
  ).textContent =
    DATA.filter(
      x =>
        x.JENIS_INFORMASI ===
        'PERUBAHAN_JAM_PRAKTIK'
    ).length;

}


/* ============================================================
   RENDER
   ============================================================ */

function render(){

  const search =
    document
      .getElementById('search')
      .value
      .trim()
      .toLowerCase();

  const filter =
    document
      .getElementById('filter')
      .value;

  const filtered =
    DATA.filter(item => {

      const text =
        (
          item.NAMA_DOKTER +
          ' ' +
          item.POLI
        )
        .toLowerCase();

      const matchSearch =
        !search ||
        text.includes(search);

      const matchFilter =
        filter === 'SEMUA' ||
        item.JENIS_INFORMASI === filter;

      return (
        matchSearch &&
        matchFilter
      );

    });

  const app =
    document.getElementById('app');

  if(!filtered.length){

    app.innerHTML =
      `
      <div class="empty">
        Tidak ada informasi dokter
        yang sesuai.
      </div>
      `;

    return;

  }

  const izin =
    filtered.filter(
      x =>
        x.JENIS_INFORMASI ===
        'DOKTER_IZIN'
    );

  const kuota =
    filtered.filter(
      x =>
        x.JENIS_INFORMASI ===
        'PERUBAHAN_KUOTA'
    );

  const jam =
    filtered.filter(
      x =>
        x.JENIS_INFORMASI ===
        'PERUBAHAN_JAM_PRAKTIK'
    );

  app.innerHTML =

    section(
      'Dokter Izin',
      'red',
      izin
    ) +

    section(
      'Perubahan Kuota',
      'orange',
      kuota
    ) +

    section(
      'Perubahan Jam Praktik',
      'purple',
      jam
    );

}


/* ============================================================
   SECTION
   ============================================================ */

function section(
  title,
  color,
  items
){

  if(!items.length){
    return '';
  }

  return `
    <section class="section">

      <div class="section-head">

        <div class="section-title">

          <span class="dot ${color}"></span>

          ${escapeHtml(title)}

        </div>

        <span class="badge future">
          ${items.length}
        </span>

      </div>

      <div class="cards">

        ${items
          .map(card)
          .join('')}

      </div>

    </section>
  `;

}


/* ============================================================
   CARD
   ============================================================ */

function card(item){

  const editUrl =
    PERAWAT_URL +
    '?edit=' +
    encodeURIComponent(
      item.ID_INFORMASI
    );

  let detail = '';

  if(
    item.JENIS_INFORMASI ===
    'DOKTER_IZIN'
  ){

    detail = `

      <div class="info-row">

        <span class="info-label">
          Periode
        </span>

        <span class="info-value">
          ${formatRange(
            item.TGL_MULAI,
            item.TGL_SELESAI,
            item.IZIN_SAMPAI_INFO
          )}
        </span>

      </div>

      ${
        item.SESI &&
        item.SESI !== 'SEMUA'
        ?
        `
        <div class="info-row">
          <span class="info-label">
            Sesi
          </span>
          <span class="info-value">
            ${escapeHtml(item.SESI)}
          </span>
        </div>
        `
        : ''
      }

      ${
        item.TGL_MULAI_PRAKTEK
        ?
        `
        <div class="info-row">
          <span class="info-label">
            Praktik kembali
          </span>
          <span class="info-value">
            ${formatDate(
              item.TGL_MULAI_PRAKTEK
            )}
            ${
              item.SESI_KEMBALI
              &&
              item.SESI_KEMBALI !== 'SEMUA'
              ?
              ' · ' +
              escapeHtml(
                item.SESI_KEMBALI
              )
              : ''
            }
          </span>
        </div>
        `
        : ''
      }

    `;

  }


  if(
    item.JENIS_INFORMASI ===
    'PERUBAHAN_KUOTA'
  ){

    detail = `

      <div class="info-row">

        <span class="info-label">
          Berlaku
        </span>

        <span class="info-value">
          ${formatRange(
            item.TGL_MULAI,
            item.TGL_SELESAI,
            'TIDAK'
          )}
        </span>

      </div>

      <div class="info-row">

        <span class="info-label">
          Kuota
        </span>

        <span class="info-value">
          ${escapeHtml(
            item.KUOTA || '-'
          )}
        </span>

      </div>

    `;

  }


  if(
    item.JENIS_INFORMASI ===
    'PERUBAHAN_JAM_PRAKTIK'
  ){

    detail = `

      <div class="info-row">

        <span class="info-label">
          Berlaku
        </span>

        <span class="info-value">
          ${formatRange(
            item.TGL_MULAI,
            item.TGL_SELESAI,
            'TIDAK'
          )}
        </span>

      </div>

      <div class="info-row">

        <span class="info-label">
          Jam praktik
        </span>

        <span class="info-value">
          ${
            escapeHtml(
              item.JAM_MULAI || '-'
            )
          }
          -
          ${
            escapeHtml(
              item.JAM_SELESAI || '-'
            )
          }
        </span>

      </div>

    `;

  }


  return `

    <article class="card">

      <div class="card-top">

        <div>

          <div class="doctor">
            ${escapeHtml(
              item.NAMA_DOKTER
            )}
          </div>

          <div class="special">
            ${escapeHtml(
              item.POLI || ''
            )}
          </div>

        </div>

        <span class="badge ${
          item.STATUS_HARI_INI ===
          'HARI_INI'
          ? 'today'
          : 'future'
        }">

          ${
            item.STATUS_HARI_INI ===
            'HARI_INI'
            ? 'HARI INI'
            : 'AKAN DATANG'
          }

        </span>

      </div>

      <div class="info">

        ${detail}

        ${
          item.KETERANGAN
          ?
          `
          <div class="note">
            ${escapeHtml(
              item.KETERANGAN
            )}
          </div>
          `
          : ''
        }

      </div>

      <button
        class="edit"
        title="Edit informasi"
        onclick="editInfo('${escapeAttr(
          editUrl
        )}')">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path
            d="M12 20h9"/>

          <path
            d="M16.5 3.5
               a2.1 2.1 0 0 1 3 3
               L7 19
               l-4 1
               1-4Z"/>

        </svg>

      </button>

    </article>

  `;

}


/* ============================================================
   EDIT
   ============================================================ */

function editInfo(url){

  window.location.href = url;

}


/* ============================================================
   FORMAT
   ============================================================ */

function formatDate(date){

  if(!date){
    return '-';
  }

  const d =
    new Date(
      date + 'T00:00:00'
    );

  if(isNaN(d)){
    return date;
  }

  return d.toLocaleDateString(
    'id-ID',
    {
      day:'numeric',
      month:'short',
      year:'numeric'
    }
  );

}


function formatRange(
  mulai,
  selesai,
  sampaiInfo
){

  if(
    sampaiInfo === 'YA'
  ){
    return (
      formatDate(mulai) +
      ' – informasi selanjutnya'
    );
  }

  if(
    !selesai ||
    selesai === mulai
  ){
    return formatDate(mulai);
  }

  return (
    formatDate(mulai) +
    ' – ' +
    formatDate(selesai)
  );

}


/* ============================================================
   SECURITY HTML
   ============================================================ */

function escapeHtml(value){

  return String(
    value == null ? '' : value
  )
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#039;');

}


function escapeAttr(value){

  return String(value || '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'");

}


/* ============================================================
   START
   ============================================================ */

loadDashboard();


/*
 * Refresh otomatis setiap 60 detik.
 */

setInterval(
  loadDashboard,
  60000
);

</script>

</body>
</html>
